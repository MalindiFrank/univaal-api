openapi: 3.1.0
info:
  title: UniVaal Admin API
  version: 1.0.0
servers:
  - url: https://api.univaal.example

components:
  securitySchemes:
    bearerAuth:
      $ref: './components/common.yaml#/components/securitySchemes/bearerAuth'

paths:
  /admin/orders:
    get:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: List orders
      description: Admin-only. Returns paged list of orders. Use query filters to narrow results.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PAID, PURCHASED, OUT_FOR_DELIVERY, DELIVERED, REFUNDED]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Orders list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: './components/common.yaml#/components/schemas/Order'
                  meta:
                    $ref: './components/common.yaml#/components/schemas/Meta'
                  links:
                    $ref: './components/common.yaml#/components/schemas/Links'
                required: [data]

  /admin/orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Get order
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: './components/common.yaml#/components/schemas/Order'
        '404':
          $ref: './components/common.yaml#/components/responses/ErrorResponse'
    patch:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Update order status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [PAID, PURCHASED, OUT_FOR_DELIVERY, DELIVERED, REFUNDED]
                procurement:
                  type: object
                  properties:
                    status:
                      type: string
                      enum: [pending, purchased, unavailable]
                    procurementRef: { type: string }
                notes: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: './components/common.yaml#/components/schemas/Order'

  /admin/orders/{orderId}/resend-email:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Resend receipt email
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                $ref: './components/common.yaml#/components/schemas/ApiResponse'

  /admin/uploads/presign:
    post:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Create presigned upload URL (admin)
      description: Returns a presigned URL and upload metadata so the admin UI can upload directly to cloud storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentType]
              properties:
                filename: { type: string, examples: [prod_001_main.webp] }
                contentType: { type: string, examples: [image/webp] }
                expiresIn:
                  type: integer
                  description: Expiration seconds for the presign URL
                  examples: [900]
      responses:
        '200':
          description: Presign info
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                    examples:
                      - https://s3.amazonaws.com/your-bucket/prod_001_main.webp?X-Amz-...
                  method:
                    type: string
                    examples: [PUT]
                  fields:
                    type: [object, 'null']
                    additionalProperties: true

  /admin/products/{productId}/images:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Register uploaded image for a product
      description: After uploading directly to the CDN/cloud, call this endpoint to register the image metadata with the product record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                alt: { type: string }
                position: { type: integer }
                meta:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Image registered
          content:
            application/json:
              schema:
                $ref: './components/common.yaml#/components/schemas/Image'

  /admin/products/{productId}/images/{imageId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }
      - name: imageId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Update image metadata (alt/position)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alt: { type: string }
                position: { type: integer }
      responses:
        '200':
          description: Updated image
          content:
            application/json:
              schema:
                $ref: './components/common.yaml#/components/schemas/Image'
    delete:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Delete product image
      responses:
        '204':
          description: Deleted

