openapi: 3.1.0
info:
  title: UniVaal API
  version: 1.0.0
  description: UniVaal MVP API – validated for Swagger Editor/UI (images + full examples)
servers:
  - url: https://api.univaal.example

paths:
  /products:
    get:
      tags: [public]
      summary: Get product catalog
      description: Returns all active products (each product may include multiple images).
      responses:
        '200':
          description: Products list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/Meta'
                  links:
                    $ref: '#/components/schemas/Links'
                required: [data]
              examples:
                sample:
                  value:
                    data:
                      - id: prod_001
                        name: A4 Notebook
                        description: 80 pages notebook
                        category: Stationery
                        price_cents: 2500
                        currency: ZAR
                        active: true
                        createdAt: '2026-01-04T10:00:00Z'
                        images:
                          - url: https://cdn.univaal.co.za/products/prod_001/main.webp
                            alt: A4 Notebook front
                            position: 0
                            meta:
                              width: 1200
                              height: 1600
                              format: webp
                          - url: https://cdn.univaal.co.za/products/prod_001/side.webp
                            alt: Side view
                            position: 1
                    meta:
                      total: 1
                      page: 1
                      limit: 50
                      currency: ZAR
                    links:
                      self: /products
                      next: null
                      prev: null

  /products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [public]
      summary: Get product by id
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/Meta'
                  links:
                    $ref: '#/components/schemas/Links'
                required: [data]
              examples:
                sample:
                  value:
                    data:
                      id: prod_001
                      name: A4 Notebook
                      description: 80 pages notebook
                      category: Stationery
                      price_cents: 2500
                      currency: ZAR
                      active: true
                      createdAt: '2026-01-04T10:00:00Z'
                      images:
                        - url: https://cdn.univaal.co.za/products/prod_001/main.webp
                          alt: A4 Notebook front
                          position: 0
                          meta:
                            width: 1200
                            height: 1600
                            format: webp
                        - url: https://cdn.univaal.co.za/products/prod_001/side.webp
                          alt: Side view
                          position: 1
                    meta:
                      total: 1
                      page: 1
                      limit: 1
                      currency: ZAR
                    links:
                      self: /products/prod_001
                      next: null
                      prev: null
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /payments/session:
    post:
      tags: [public]
      summary: Create payment session (PendingPayment)
      description: Create a pending payment attempt. Returns provider redirect info. Backend will store a PendingPayment and idempotencyKey.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentSessionRequest'
            examples:
              sample:
                value:
                  items:
                    - productId: prod_001
                      productNameSnapshot: A4 Notebook
                      unitPrice_cents: 2500
                      quantity: 2
                  customer:
                    name: John Doe
                    email: john@example.com
                    phone: '+27123456789'
                  deliveryAddress:
                    residence: UniVaal Res A
                    room: B12
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSessionResponse'
              examples:
                sample:
                  value:
                    paymentProvider: payfast
                    paymentSessionId: sess_abc123
                    redirectUrl: https://payfast.co.za/checkout/sess_abc123
                    expiresAt: '2026-01-05T10:00:00Z'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /payments/confirm:
    post:
      tags: [public]
      summary: Client-side payment confirmation (optional)
      description: Optional endpoint used if frontend collects a payment token that server must confirm. Final order creation should be authoritative via webhook.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentConfirmRequest'
            examples:
              sample:
                value:
                  paymentToken: pm_abc123
                  sessionId: sess_abc123
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples: [processing]

  /webhooks/payments:
    post:
      tags: [webhook]
      summary: Payment provider webhook
      description: Provider calls this endpoint to notify about payment events. Validate signature and create Order once payment is confirmed.
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookPayload'
            examples:
              payment_success:
                value:
                  event: payment_success
                  providerPaymentId: pf_ch_abc123
                  sessionId: sess_abc123
                  amount_cents: 5000
                  currency: ZAR
                  metadata:
                    cartHash: prod_001:2
      responses:
        '200':
          description: Processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                ok:
                  value:
                    success: true
                    data: {}

  /order/track/{publicToken}:
    parameters:
      - name: publicToken
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [public]
      summary: Track order by public token
      description: Public tracking view — no auth required. Returns limited order info.
      responses:
        '200':
          description: Order tracking data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrderPublic'
                  meta:
                    $ref: '#/components/schemas/Meta'
                  links:
                    $ref: '#/components/schemas/Links'
                required: [data]
              examples:
                sample:
                  value:
                    data:
                      orderId: order_0001
                      status: PAID
                      items:
                        - productId: prod_001
                          productNameSnapshot: A4 Notebook
                          unitPrice_cents: 2500
                          quantity: 2
                          lineTotal_cents: 5000
                      total_cents: 5000
                      currency: ZAR
                      deliveryAddress:
                        residence: UniVaal Res A
                        room: B12
                      procurement:
                        status: pending
                      createdAt: '2026-01-04T10:03:00Z'
                    meta:
                      currency: ZAR
                    links:
                      self: /order/track/9f3a7c82b4e61d90f0a3
                      next: null
                      prev: null
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /admin/orders:
    get:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: List orders
      description: Admin-only. Returns paged list of orders. Use query filters to narrow results.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PAID, PURCHASED, OUT_FOR_DELIVERY, DELIVERED, REFUNDED]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Orders list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/Meta'
                  links:
                    $ref: '#/components/schemas/Links'
                required: [data]
              examples:
                sample:
                  value:
                    data:
                      - id: order_0001
                        status: PAID
                        total_cents: 5000
                        currency: ZAR
                        createdAt: '2026-01-04T10:03:00Z'
                    meta:
                      total: 1
                      page: 1
                      limit: 20
                      currency: ZAR
                    links:
                      self: /admin/orders?page=1&limit=20
                      next: null
                      prev: null

  /admin/orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Get order
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                sample:
                  value:
                    id: order_0001
                    status: PAID
                    items:
                      - productId: prod_001
                        productNameSnapshot: A4 Notebook
                        unitPrice_cents: 2500
                        quantity: 2
                        lineTotal_cents: 5000
                    subtotal_cents: 5000
                    shipping_cents: 0
                    tax_cents: 0
                    total_cents: 5000
                    currency: ZAR
                    customer:
                      name: John Doe
                      email: john@example.com
                    deliveryAddress:
                      residence: UniVaal Res A
                      room: B12
                    publicTrackingToken: 9f3a7c82b4e61d90f0a3
                    createdAt: '2026-01-04T10:03:00Z'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Update order status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [PAID, PURCHASED, OUT_FOR_DELIVERY, DELIVERED, REFUNDED]
                procurement:
                  type: object
                  properties:
                    status:
                      type: string
                      enum: [pending, purchased, unavailable]
                    procurementRef:
                      type: string
                notes:
                  type: string
            examples:
              sample:
                value:
                  status: PURCHASED
                  procurement:
                    status: purchased
                    procurementRef: wh_453
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                sample:
                  value:
                    id: order_0001
                    status: PURCHASED
                    updatedAt: '2026-01-04T12:00:00Z'

  /admin/orders/{orderId}/resend-email:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Resend receipt email
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                sample:
                  value:
                    success: true
                    data: {}

  /admin/uploads/presign:
    post:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Create presigned upload URL (admin)
      description: Returns a presigned URL and upload metadata so the admin UI can upload directly to cloud storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentType]
              properties:
                filename:
                  type: string
                  examples: [prod_001_main.webp]
                contentType:
                  type: string
                  examples: [image/webp]
                expiresIn:
                  type: integer
                  description: Expiration seconds for the presign URL
                  examples: [900]
      responses:
        '200':
          description: Presign info
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                    examples:
                      - https://s3.amazonaws.com/your-bucket/prod_001_main.webp?X-Amz-...
                  method:
                    type: string
                    examples: [PUT]
                  fields:
                    type: [object, 'null']
                    additionalProperties: true
              examples:
                sample:
                  value:
                    uploadUrl: https://s3.amazonaws.com/your-bucket/prod_001_main.webp?X-Amz-...
                    method: PUT
                    fields: {}

  /admin/products/{productId}/images:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Register uploaded image for a product
      description: After uploading directly to the CDN/cloud, call this endpoint to register the image metadata with the product record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  examples:
                    - https://cdn.univaal.co.za/products/prod_001/main.webp
                alt:
                  type: string
                  examples:
                    - A4 Notebook - front cover
                position:
                  type: integer
                  examples: [0]
                meta:
                  type: object
                  additionalProperties: true
            examples:
              sample:
                value:
                  url: https://cdn.univaal.co.za/products/prod_001/main.webp
                  alt: A4 Notebook - front cover
                  position: 0
      responses:
        '201':
          description: Image registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
              examples:
                sample:
                  value:
                    id: img_1
                    url: https://cdn.univaal.co.za/products/prod_001/main.webp
                    alt: A4 Notebook - front cover
                    position: 0
                    meta:
                      width: 1200
                      height: 1600
                      format: webp

  /admin/products/{productId}/images/{imageId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }
      - name: imageId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Update image metadata (alt/position)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alt: { type: string }
                position: { type: integer }
            examples:
              sample:
                value:
                  alt: Updated alt text
                  position: 0
      responses:
        '200':
          description: Updated image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Image'
              examples:
                sample:
                  value:
                    id: img_1
                    url: https://cdn.univaal.co.za/products/prod_001/main.webp
                    alt: Updated alt text
                    position: 0
                    meta:
                      width: 1200
                      height: 1600
                      format: webp
    delete:
      tags: [admin]
      security:
        - bearerAuth: []
      summary: Delete product image
      responses:
        '204':
          description: Deleted

components:
  schemas:
    Product:
      type: object
      required: [id, name, price_cents, category, currency]
      properties:
        id:
          type: string
          examples: [prod_001]
        name:
          type: string
          examples: [A4 Notebook]
        description:
          type: string
          examples: [80 pages notebook]
        category:
          type: string
          description: Product category label used for filtering and browsing.
          examples: [Stationery]
        price_cents:
          type: integer
          examples: [2500]
        currency:
          type: string
          examples: [ZAR]
        active:
          type: boolean
          examples: [true]
        createdAt:
          type: string
          format: date-time
          examples: ['2026-01-04T10:00:00Z']
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'

    OrderItem:
      type: object
      required: [productId, productNameSnapshot, unitPrice_cents, quantity]
      properties:
        productId:
          type: string
          examples: [prod_001]
        productNameSnapshot:
          type: string
          examples: [A4 Notebook]
        unitPrice_cents:
          type: integer
          examples: [2500]
        quantity:
          type: integer
          examples: [2]
        lineTotal_cents:
          type: integer
          description: Present in responses only. Server-calculated.
          examples: [5000]

    OrderItemRequest:
      type: object
      required: [productId, productNameSnapshot, unitPrice_cents, quantity]
      properties:
        productId:
          type: string
          examples: [prod_001]
        productNameSnapshot:
          type: string
          examples: [A4 Notebook]
        unitPrice_cents:
          type: integer
          examples: [2500]
        quantity:
          type: integer
          examples: [2]

    Customer:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          examples: [John Doe]
        email:
          type: string
          examples: [john@example.com]
        phone:
          type: string
          examples: ['+27123456789']

    DeliveryAddress:
      type: object
      properties:
        residence:
          type: string
          examples: [UniVaal Res A]
        room:
          type: string
          examples: [B12]
        notes:
          type: string
          examples: [Leave at reception]

    Order:
      type: object
      properties:
        id:
          type: string
          examples: [order_0001]
        status:
          type: string
          enum: [PAID, PURCHASED, OUT_FOR_DELIVERY, DELIVERED, REFUNDED]
          examples: [PAID]
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal_cents:
          type: integer
          examples: [5000]
        shipping_cents:
          type: integer
          examples: [0]
        tax_cents:
          type: integer
          examples: [0]
        total_cents:
          type: integer
          examples: [5000]
        currency:
          type: string
          examples: [ZAR]
        customer:
          $ref: '#/components/schemas/Customer'
        deliveryAddress:
          $ref: '#/components/schemas/DeliveryAddress'
        payment:
          type: object
          properties:
            provider:
              type: string
              examples: [payfast]
            providerPaymentId:
              type: string
              examples: [pf_ch_abc123]
            status:
              type: string
              examples: [captured]
        publicTrackingToken:
          type: string
          examples: [9f3a7c82b4e61d90f0a3]
        procurement:
          type: object
          properties:
            status:
              type: string
              enum: [pending, purchased, unavailable]
              examples: [pending]
            procurementRef:
              type: string
              examples: [wh_453]
        audit:
          type: object
          properties:
            clientIp:
              type: string
              examples: [197.210.70.1]
            userAgent:
              type: string
              examples: [Mozilla/5.0]
        createdAt:
          type: string
          format: date-time
          examples: ['2026-01-04T10:03:00Z']
        updatedAt:
          type: string
          format: date-time
          examples: ['2026-01-04T12:00:00Z']

    OrderPublic:
      type: object
      properties:
        orderId:
          type: string
          examples: [order_0001]
        status:
          type: string
          examples: [PAID]
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total_cents:
          type: integer
          examples: [5000]
        currency:
          type: string
          examples: [ZAR]
        deliveryAddress:
          $ref: '#/components/schemas/DeliveryAddress'
        procurement:
          type: object
          properties:
            status:
              type: string
              examples: [pending]
        createdAt:
          type: string
          format: date-time
          examples: ['2026-01-04T10:03:00Z']

    PaymentSessionRequest:
      type: object
      required: [items, customer, deliveryAddress]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        customer:
          $ref: '#/components/schemas/Customer'
        deliveryAddress:
          $ref: '#/components/schemas/DeliveryAddress'
        metadata:
          type: object
          additionalProperties: true

    PaymentSessionResponse:
      type: object
      properties:
        paymentProvider:
          type: string
          examples: [payfast]
        paymentSessionId:
          type: string
          examples: [sess_abc123]
        redirectUrl:
          type: string
          examples: [https://payfast.co.za/checkout/sess_abc123]
        expiresAt:
          type: string
          format: date-time
          examples: ['2026-01-05T10:00:00Z']

    PaymentConfirmRequest:
      type: object
      required: [paymentToken, sessionId]
      properties:
        paymentToken:
          type: string
          examples: [pm_abc123]
        sessionId:
          type: string
          examples: [sess_abc123]

    PaymentWebhookPayload:
      type: object
      properties:
        event:
          type: string
          examples: [payment_success]
        sessionId:
          type: string
          examples: [sess_abc123]
        providerPaymentId:
          type: string
          examples: [pf_ch_abc123]
        amount_cents:
          type: integer
          examples: [5000]
        currency:
          type: string
          examples: [ZAR]
        metadata:
          type: object
          additionalProperties: true

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          examples: [true]
        data:
          type: [object, 'null']
        error:
          type: [object, 'null']

    Image:
      type: object
      required: [id, url]
      properties:
        id:
          type: string
          examples: [img_1]
        url:
          type: string
          format: uri
          examples: [https://cdn.univaal.co.za/products/prod_001/main.webp]
        alt:
          type: string
          examples: [A4 Notebook - front cover]
        position:
          type: integer
          examples: [0]
        meta:
          type: object
          properties:
            width:
              type: integer
              examples: [1200]
            height:
              type: integer
              examples: [1600]
            format:
              type: string
              examples: [webp]

    Meta:
      type: object
      properties:
        total:
          type: integer
          description: Total number of products in the catalogue (for pagination).
          examples: [1, 87]
        page:
          type: integer
          description: Current page number.
          examples: [1, 3]
        limit:
          type: integer
          description: Number of items per page.
          examples: [10, 50]
        currency:
          type: string
          description: Default currency for prices (consistent across all products).
          examples: [ZAR]

    Links:
      type: object
      properties:
        self:
          type: string
          format: uri-reference
          description: URL to the current page of results.
          examples: ["/products", "/products?page=2&category=Stationery"]
        next:
          type: [string, 'null']
          format: uri-reference
          description: URL to the next page (null if none).
          examples: ["/products?page=2", null]
        prev:
          type: [string, 'null']
          format: uri-reference
          description: URL to the previous page (null if none).
          examples: ["/products?page=1", null]

  responses:
    ErrorResponse:
      description: Error response (consistent envelope)
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: 'null'
              errors:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                      examples: [NOT_FOUND, VALIDATION_ERROR]
                    message:
                      type: string
                      examples: [Resource not found, Invalid request data]
                  required: [code, message]
              meta:
                $ref: '#/components/schemas/Meta'
              links:
                $ref: '#/components/schemas/Links'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
      required: false
      description: Idempotency key for safe retries
